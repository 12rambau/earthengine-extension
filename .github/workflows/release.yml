name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to extension marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npx @vscode/vsce package --pre-release
          else
            npx @vscode/vsce package
          fi

      - name: Publish to Marketplace
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npx @vscode/vsce publish --packagePath *.vsix --pre-release
          else
            npx @vscode/vsce publish --packagePath *.vsix
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npx ovsx publish *.vsix --pre-release -p "${{ secrets.OVSX_PAT }}"
          else
            npx ovsx publish *.vsix -p "${{ secrets.OVSX_PAT }}"
          fi

  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation
        working-directory: website
        env:
          DEPLOYMENT_TARGET: github-pages
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy-documentation:
    name: Deploy documentation
    needs: build-documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
