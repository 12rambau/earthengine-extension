name: Release

on:
  release:
    types: [published]

jobs:
  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npx @vscode/vsce package --pre-release
          else
            npx @vscode/vsce package
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'

  publish-marketplace:
    name: Publish to VS Marketplace
    needs: build-vsix
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish to Marketplace
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npx @vscode/vsce publish --packagePath *.vsix --pre-release
          else
            npx @vscode/vsce publish --packagePath *.vsix
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: Publish to Open VSX
    needs: build-vsix
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish to Open VSX
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npx ovsx publish *.vsix --pre-release -p "${{ secrets.OVSX_PAT }}"
          else
            npx ovsx publish *.vsix -p "${{ secrets.OVSX_PAT }}"
          fi

  publish-pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). See
      # https://docs.pypi.org/trusted-publishers/ for setup instructions.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation
        working-directory: website
        env:
          DEPLOYMENT_TARGET: github-pages
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy-documentation:
    name: Deploy documentation
    needs: build-documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
