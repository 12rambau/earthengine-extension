name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: MDX formatting
        run: npm run check-mdx-format

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Type-check
        run: npm run check-types

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python package and test dependencies
        run: python -m pip install -e './python[dev]'

      - name: Run Python tests with coverage
        run: python -m pytest python/tests --cov=python/vscee --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Python coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          disable_search: true
          flags: python
          fail_ci_if_error: true
          use_oidc: true
