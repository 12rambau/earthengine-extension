[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vscee"
version = "0.6.6"
description = "Python bridge to the interactive map panel of the Earth Engine VS Code extension."
readme = "README.rst"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["earthengine", "vscode", "map", "bridge", "leaflet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["earthengine-api"]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[[project.authors]]
    name = "Pierrick Rambaud"
    email = "pierrick.rambaud49@gmail.com"

[project.urls]
Homepage = "https://github.com/12rambau/earthengine-extension"

[tool.hatch.build.targets.wheel]
packages = ["vscee"]

[tool.hatch.build.targets.sdist]
only-include = ["vscee"]

[tool.ruff]
fix = true
extend-exclude = ["vscee/__init__.py"]
force-exclude = true # to make sure exclude is respected when used via pre-commit

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "RUF"]
ignore = [
    "E501",  # line too long | Black take care of it
    "D213",  # Multi-line docstring | We use D212
    "E741",  # Ambiguous variable name: `l` | TODO
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
scripts_are_modules = true
ignore_missing_imports = true
install_types = true
non_interactive = true
warn_redundant_casts = true
